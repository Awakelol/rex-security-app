name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Work out version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version should look like 1.2.3, got '$v'"
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          # Android refuses to install an older versionCode over a newer one, so it must only go up.
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          REX_KEYSTORE_BASE64: ${{ secrets.REX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$REX_KEYSTORE_BASE64" ]; then
            echo "::error::The REX_KEYSTORE_BASE64 secret isn't set. See the README."
            exit 1
          fi
          echo "$REX_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rex-release.jks"

      - name: Test and build
        env:
          REX_KEYSTORE: ${{ runner.temp }}/rex-release.jks
          REX_KEYSTORE_PASSWORD: ${{ secrets.REX_KEYSTORE_PASSWORD }}
        run: >
          ./gradlew test assembleRelease
          -PrexVersionCode=${{ steps.version.outputs.code }}
          -PrexVersionName=${{ steps.version.outputs.name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk rex.apk
          gh release create "v$VERSION" rex.apk --title "Rex $VERSION" --generate-notes --target "$GITHUB_SHA"
